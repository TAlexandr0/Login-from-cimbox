services:
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: cimbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speckle}
      POSTGRES_USER: ${POSTGRES_USER:-speckle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speckle}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-speckle} -d $${POSTGRES_DB:-speckle}']
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:latest
    container_name: cimbox-maildev
    restart: unless-stopped
    ports:
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:1025:1025'

  server:
    image: panel/server:2026-11-09-01
    pull_policy: never
    container_name: cimbox-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      CANONICAL_URL: ${CANONICAL_URL:-http://localhost:8080}
      POSTGRES_URL: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-speckle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speckle}
      POSTGRES_DB: ${POSTGRES_DB:-speckle}
      EMAIL: 'true'
      EMAIL_HOST: ${EMAIL_HOST:-maildev}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@cimbox.ru}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_REQUIRE_TLS: ${EMAIL_REQUIRE_TLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/readiness', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: panel/front:2026-11-09-01
    pull_policy: never
    container_name: cimbox-frontend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: '0.0.0.0'
      BACKEND_URL: 'http://server:3000'
      NUXT_PUBLIC_BACKEND_API_ORIGIN: 'http://server:3000'
      NUXT_PUBLIC_API_ORIGIN: ${CANONICAL_URL:-http://localhost:8080}
      NUXT_PUBLIC_BASE_URL: ${CANONICAL_URL:-http://localhost:8080}
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
